name: PS5 Stock Checker

on:
  schedule:
    - cron: '*/5 * * * *'

  workflow_dispatch:
    inputs:
      custom_url:
        description: 'Product URL to test (leave blank to check the PS5)'
        required: false
        type: string
        default: ''

      disable_ping:
        description: 'Silent Mode (detect stock but do not send Discord notification)'
        required: false
        type: boolean
        default: true

jobs:
  check-stock:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run checker
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          EVENT_NAME: ${{ github.event_name }}
          CUSTOM_URL: ${{ inputs.custom_url || '' }}
          DISABLE_PING: ${{ inputs.disable_ping || 'false' }}
        run: python check_stock.py
      - name: Notify Discord if checker fails
        if: ${{ failure() }}
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          curl -sS \
            -H "Content-Type: application/json" \
            -d "{\"content\":\"⚠️ **PS5 STOCK CHECKER ERROR** ⚠️\nThe stock checker failed or could not determine stock status.\nCheck the GitHub Actions logs:\nhttps://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "$DISCORD_WEBHOOK"

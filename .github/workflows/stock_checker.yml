name: PS5 Stock Checker

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      test_mode:
        description: 'Run in Test Mode (forces a Discord ping even if out of stock)'
        required: false
        type: boolean
        default: false
      disable_ping:
        description: 'Silent Mode (checks stock but disables Discord notifications)'
        required: false
        type: boolean
        default: false

jobs:
  check-stock:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4
          
      - name: Run checker
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          TEST_MODE: ${{ inputs.test_mode || 'false' }}
          DISABLE_PING: ${{ inputs.disable_ping || 'false' }}
        run: python check_stock.py
